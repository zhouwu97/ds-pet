<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大肥鱼 · 三端桌宠</title>
<style>body{margin:0;background:#181a26;color:#edf0ff;font:15px/1.7 system-ui,sans-serif;padding:clamp(20px,6vw,80px)}main{max-width:960px;margin:auto;display:grid;grid-template-columns:1fr 340px;gap:60px;align-items:center}h1{font-size:48px;line-height:1.2;letter-spacing:-.05em}p{color:#a7acc1}a{color:#b8caff}nav{display:flex;gap:20px}.card{border:1px solid #ffffff20;background:#ffffff05;padding:24px;border-radius:24px}h2{font-size:21px;margin:0}.eyebrow{font-size:11px;letter-spacing:.18em;color:#9fafd9}.actions{margin-top:30px;display:flex;flex-wrap:wrap;gap:8px}button{background:#ffffff0b;border:1px solid #ffffff20;color:#cad3f0;border-radius:8px;padding:8px 12px;cursor:pointer}@media(max-width:720px){main{grid-template-columns:1fr;gap:20px}h1{font-size:36px}}</style></head>
<body><main><section><span class="eyebrow">CODEX / DSH / WEB</span><h1>大肥鱼，<br>陪你认真摸鱼。</h1><p>同一只鲸鲸娘，三个小世界。点击打招呼、悬停跳跃，拖动她去喜欢的位置。没有对话框，也不会调用模型。</p><nav><a href="../codex/jingjing-spritesheet.png" download>Codex 精灵图</a><a href="../dsh/README.md">DSH 安装说明</a></nav><div class="actions" aria-label="模拟宿主状态"><button data-state="idle">空闲</button><button data-state="running">工作</button><button data-state="waiting">等待</button><button data-state="review">完成</button><button data-state="failed">失败</button></div><p><small>以上按钮只演示宿主状态，不读取账户或会话。</small></p></section><section class="card"><h2>大肥鱼 AI 助手</h2><jingjing-pet src="../codex/jingjing-spritesheet.png" storage-key="jingjing-web-demo"></jingjing-pet></section></main>
<script type="module">import { registerJingjingPet } from './jingjing-pet.js';registerJingjingPet();document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>document.querySelector('jingjing-pet').setActivity(b.dataset.state));</script></body></html>
